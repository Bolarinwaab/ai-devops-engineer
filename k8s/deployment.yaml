apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-devops-engineer
  labels:
    app: ai-devops-engineer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-devops-engineer
  template:
    metadata:
      labels:
        app: ai-devops-engineer
    spec:
      containers:
        - name: api
          image: ai-devops-engineer:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
